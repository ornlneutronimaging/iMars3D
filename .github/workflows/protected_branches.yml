name: protected-branches

on:
  workflow_dispatch:
  push:
    branches: [next]
    tags: ['v*']

jobs:
  integration-tests:
    runs-on: imars3d-builder
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Add pending status
        uses: Sibz/github-status-action@v1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: "Tests with data repository"
          description: "pending"
          state: "pending"
          sha: "${{ github.sha }}"
          target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.50.2
          manifest: pyproject.toml
      - name: Tests with data repository
        run: pixi run pytest -m datarepo
      - name: Update job status
        uses: Sibz/github-status-action@v1
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: "Tests with data repository"
          description: "${{ job.status }}"
          state: "${{ job.status }}"
          sha: "${{ github.sha }}"
          target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  build-conda:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.50.2
          manifest: pyproject.toml
      - name: Build Conda Package
        run: |
          # Build conda package using pixi
          pixi run conda-build
      - name: Deploy to Anaconda
        shell: bash -l {0}
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          IS_RC: ${{ contains(github.ref, 'rc') }}
        run: |
          # label is main or rc depending on the tag-name
          CONDA_LABEL="main"
          if [ "${IS_RC}" = "true" ]; then CONDA_LABEL="rc"; fi
          echo pushing ${{ github.ref }} with label $CONDA_LABEL
          pixi run anaconda upload --label $CONDA_LABEL *.conda
